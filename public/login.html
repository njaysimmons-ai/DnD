<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120f17">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Table Chronicle</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login">
    <form id="login" class="card">
      <h1>🎲 Table Chronicle</h1>
      <label>Password <input type="password" id="password" autocomplete="current-password" required autofocus></label>
      <p id="login-error" class="error"></p>
      <button class="primary">Enter</button>
    </form>
  </main>
  <script>
    document.getElementById("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/login", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ password: document.getElementById("password").value }),
      });
      if (!res.ok) {
        document.getElementById("login-error").textContent = "That password didn't work.";
        return;
      }
      const next = new URLSearchParams(location.search).get("next") || "/";
      // The browser keeps "#sessions" on this page through the redirect; carry it on.
      location.href = (next.startsWith("/") && !next.startsWith("//") ? next : "/") + location.hash;
    });
  </script>
</body>
</html>
